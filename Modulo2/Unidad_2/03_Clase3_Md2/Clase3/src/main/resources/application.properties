spring.application.name=Clase3
spring.datasource.url=jdbc:postgresql://localhost:5432/shopsystem_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#server.port = 8081

# Swagger UI ? configuración para Spring Boot 4
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Clave secreta para firmar los tokens JWT
# IMPORTANTE: en producción esta clave debe ser larga, aleatoria y nunca versionada en Git
jwt.secret=clave-super-secreta-shopsystem-2026-no-compartir
# Tiempo de vida del token en milisegundos: 86400000 = 24 horas
jwt.expiration=86400000